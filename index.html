<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peak AI — Demo</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
  :root {
    --accent: #ffd400; --accent-soft: rgba(255, 212, 0, 0.14);
    --bg: #0a0a0b; --bg-2: #141417; --card: #16161a; --card-brd: #26262c;
    --text: #f4f4f5; --text-dim: #a1a1aa; --text-faint: #6b6b73;
    --grid: rgba(255, 255, 255, 0.06);
    --shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 24px rgba(0,0,0,0.45);
  }
  :root.light {
    --accent: #f5a800; --accent-soft: rgba(245, 168, 0, 0.14);
    --bg: #f6f6f4; --bg-2: #ffffff; --card: #ffffff; --card-brd: #e6e6e2;
    --text: #18181b; --text-dim: #52525b; --text-faint: #8a8a93;
    --grid: rgba(0, 0, 0, 0.07);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 18px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; transition: background .25s ease, color .25s ease; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 34px) 60px; }

  header.top { display: flex; align-items: center; gap: 16px; padding: 4px 0 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .logo-img { height: 46px; width: auto; display: block; filter: invert(1); transition: filter .25s ease; }
  :root.light .logo-img { filter: none; }
  .brand .badge { font-size: 11px; font-weight: 700; color: #111; background: var(--accent); padding: 2px 8px; border-radius: 6px; letter-spacing: .04em; }
  .brand .tagline { display:block; font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -.1px; max-width: 640px; }
  .brand p { margin: 4px 0 0; font-size: 12.5px; font-weight:600; color: var(--text-dim); }
  .spacer { flex: 1; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; background: var(--bg-2); border: 1px solid var(--card-brd); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--text-dim); padding: 7px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600; transition: background .15s, color .15s; }
  .seg button.active { background: var(--accent); color: #111; }
  select.ctl { background: var(--bg-2); border: 1px solid var(--card-brd); color: var(--text); padding: 7px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .icon-btn { background: var(--bg-2); border: 1px solid var(--card-brd); color: var(--text); height: 34px; min-width: 38px; padding: 0 10px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; display: grid; place-items: center; }
  .icon-btn:hover { border-color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 1050px){ .kpis { grid-template-columns: repeat(3,1fr);} }
  @media (max-width: 560px){ .kpis { grid-template-columns: repeat(2,1fr);} }
  .kpi { background: var(--card); border: 1px solid var(--card-brd); border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .kpi .lbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .kpi .val { font-size: 23px; font-weight: 800; margin-top: 6px; letter-spacing: -0.5px; }
  .kpi .val small { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .kpi .sub { font-size: 11.5px; margin-top: 3px; color: var(--text-dim); }
  .kpi .up { color: #22c55e; } .kpi .down { color: #ef4444; }
  .kpi::after { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--accent); opacity:.85; }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--card-brd); border-radius: 16px; padding: 16px 16px 8px; box-shadow: var(--shadow); }
  .card h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.2px; display:flex; align-items:center; gap:8px; }
  .card h3 .dot { width:8px; height:8px; border-radius:50%; background: var(--accent); }
  .card .hint { font-size: 11.5px; color: var(--text-faint); margin: 3px 0 6px; }
  .chart { width: 100%; height: 300px; }
  .col-8 { grid-column: span 8; } .col-6 { grid-column: span 6; }
  .col-4 { grid-column: span 4; } .col-12 { grid-column: span 12; }
  @media (max-width: 900px){ .col-8,.col-6,.col-4 { grid-column: span 12; } }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-faint); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--card-brd); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--grid); color: var(--text); }
  tr:hover td { background: var(--accent-soft); }
  .pill { display:inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .src { font-size: 10.5px; color: var(--text-faint); }
  .num { font-variant-numeric: tabular-nums; }
  .foot { margin-top: 26px; text-align:center; font-size: 11.5px; color: var(--text-faint); }
  .foot code { color: var(--accent); }

  /* tabs */
  .tabs { display:flex; gap:4px; margin:2px 0 18px; border-bottom:1px solid var(--card-brd); }
  .tabs button { background:transparent; border:0; border-bottom:2px solid transparent; color:var(--text-dim); font-weight:700; font-size:14px; padding:9px 15px; cursor:pointer; margin-bottom:-1px; display:flex; align-items:center; gap:7px; }
  .tabs button.active { color:var(--text); border-bottom-color:var(--accent); }
  .tabs button:hover { color:var(--text); }
  /* coach tab */
  .coach-grid { display:grid; grid-template-columns:1.9fr 1fr; gap:14px; }
  @media (max-width:900px){ .coach-grid { grid-template-columns:1fr; } }
  .week { display:flex; flex-direction:column; gap:10px; }
  .day { display:flex; gap:13px; background:var(--card); border:1px solid var(--card-brd); border-radius:14px; padding:13px 15px; box-shadow:var(--shadow); }
  .day.rest { opacity:.82; }
  .day .dcol { display:flex; flex-direction:column; align-items:center; min-width:46px; padding-top:2px; }
  .day .dow { font-weight:800; color:var(--accent); font-size:13px; }
  .day .dnum { font-size:10.5px; color:var(--text-faint); margin-top:2px; }
  .day .dbody { flex:1; }
  .day .dtitle { font-weight:700; font-size:14px; }
  .day .ddetail { font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.5; }
  .day .dzone { display:inline-block; margin-top:7px; font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; background:var(--accent-soft); color:var(--accent); }
  .coach-side .card { margin-bottom:14px; }
  .notes2 { margin:0; padding:0; list-style:none; }
  .notes2 li { font-size:12.5px; color:var(--text-dim); padding:5px 0 5px 16px; position:relative; }
  .notes2 li::before { content:"▸"; color:var(--accent); position:absolute; left:0; }
  .state-tbl { width:100%; font-size:12.5px; border-collapse:collapse; }
  .state-tbl td { padding:6px 4px; border-bottom:1px solid var(--grid); vertical-align:top; }
  .state-tbl tr:last-child td { border-bottom:0; }
  .state-tbl td:first-child { color:var(--text-faint); white-space:nowrap; padding-right:12px; font-weight:600; }
  .cbox { width:100%; min-height:78px; background:var(--bg-2); border:1px solid var(--card-brd); border-radius:10px; color:var(--text); padding:10px; font-family:inherit; font-size:13px; resize:vertical; }
  .cbtn { margin-top:8px; background:var(--accent); color:#111; border:0; border-radius:9px; padding:8px 15px; font-weight:700; cursor:pointer; }
  .cbtn:hover { opacity:.9; }
  /* athlete tab */
  .athbox { width:100%; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.5; background:var(--bg-2); color:var(--text); border:1px solid var(--card-brd); border-radius:10px; padding:11px 12px; resize:vertical; }
  .athmsg { font-size:11.5px; margin-left:10px; color:var(--text-faint); }
  .athmsg.ok { color:#22c55e; } .athmsg.err { color:#ef4444; }
  .compform { margin-top:12px; border-top:1px solid var(--card-brd); padding-top:12px; }
  .comprow { display:flex; gap:8px; }
  .comprow > .cin { flex:1; }
  .cin { width:100%; margin-top:8px; background:var(--bg-2); color:var(--text); border:1px solid var(--card-brd); border-radius:9px; padding:8px 10px; font-size:12.5px; font-weight:600; }
  .pfform { display:flex; flex-direction:column; gap:2px; }
  .pf { display:flex; flex-direction:column; }
  .pf > span { font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-top:10px; }
  .pfarea { min-height:52px; resize:vertical; font-weight:500; }
  .compitem { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--card-brd); }
  .compitem:last-child { border-bottom:0; }
  .compitem .ci-main { flex:1; }
  .compitem .ci-name { font-weight:700; font-size:13px; }
  .compitem .ci-meta { font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .compitem .ci-prio { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--accent-soft); color:var(--accent); align-self:center; }
  .compitem .ci-del { background:transparent; border:0; color:var(--text-faint); cursor:pointer; font-size:15px; padding:2px 6px; }
  .compitem .ci-del:hover { color:#ef4444; }
  .countdown { font-size:30px; font-weight:800; letter-spacing:-1px; }
  .countdown small { font-size:13px; font-weight:600; color:var(--text-dim); }
  .season-next { font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .season-phase { display:inline-block; margin-top:10px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:7px; background:var(--accent-soft); color:var(--accent); }
  .cnote { font-size:11px; color:var(--text-faint); margin-top:7px; }
  .clist { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .citem { background:var(--bg-2); border:1px solid var(--card-brd); border-radius:10px; padding:8px 10px; font-size:12.5px; color:var(--text); }
  .citem .cdate { font-size:10.5px; color:var(--text-faint); margin-bottom:2px; }

  /* overlay */
  #overlay { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 50; text-align: center; padding: 20px; }
  #overlay .box { max-width: 460px; }
  #overlay h2 { font-size: 18px; margin: 14px 0 6px; }
  #overlay p { color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
  #overlay .spin { width: 34px; height: 34px; border: 3px solid var(--card-brd); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .drop { margin-top: 16px; border: 1.5px dashed var(--card-brd); border-radius: 14px; padding: 22px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { color: var(--accent); }
  .err { color: #ef4444; font-size: 12.5px; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="overlay">
  <div class="box">
    <div class="spin" id="spin"></div>
    <h2 id="ovTitle">Loading your data…</h2>
    <p id="ovMsg">Preparing your activities, recovery and sleep.</p>
    <div class="drop hidden" id="drop">
      <p style="margin:0"><b id="dropCta">Select your data folder</b><br><span id="dropSub" style="font-size:12px;color:var(--text-faint)">Click here, or drag the files in</span></p>
      <input type="file" id="picker" webkitdirectory directory multiple class="hidden" />
    </div>
    <p class="err hidden" id="ovErr"></p>
  </div>
</div>

<div class="wrap hidden" id="app">
  <header class="top">
    <div class="brand">
      <img class="logo-img" src="logo.png" alt="Peak AI" />
      <div>
        <span class="tagline" id="tagline"></span>
        <p id="subtitle"></p>
      </div>
      <span class="badge" id="demoBadge">DEMO</span>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="seg" id="rangeSeg">
        <button data-r="3m"></button>
        <button data-r="12m" class="active"></button>
        <button data-r="all"></button>
      </div>
      <select class="ctl" id="sportFilter"></select>
      <button class="icon-btn" id="langBtn" title="Language / Idioma">ES</button>
      <button class="icon-btn" id="themeBtn" title="Theme">☀︎</button>
    </div>
  </header>

  <div class="tabs">
    <button id="tabDash" class="active" data-tab="dashboard"></button>
    <button id="tabCoach" data-tab="coach"></button>
    <button id="tabAthlete" data-tab="athlete"></button>
  </div>

  <section id="viewDashboard">
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card col-8"><h3><span class="dot"></span><span data-t="t_volume"></span></h3><p class="hint" data-t="h_volume"></p><div class="chart" id="chVolume"></div></div>
    <div class="card col-4"><h3><span class="dot"></span><span data-t="t_sport"></span></h3><p class="hint" data-t="h_sport"></p><div class="chart" id="chSport"></div></div>

    <div class="card col-8"><h3><span class="dot"></span><span data-t="t_pace"></span></h3><p class="hint" data-t="h_pace"></p><div class="chart" id="chPace"></div></div>
    <div class="card col-4"><h3><span class="dot"></span><span data-t="t_intensity"></span></h3><p class="hint" data-t="h_intensity"></p><div class="chart" id="chIntensity"></div></div>

    <div class="card col-8"><h3><span class="dot"></span><span data-t="t_cal"></span></h3><p class="hint" data-t="h_cal"></p><div class="chart" id="chCalendar" style="height:230px;"></div></div>
    <div class="card col-4"><h3><span class="dot"></span><span data-t="t_recovery"></span></h3><p class="hint" data-t="h_recovery"></p><div class="chart" id="chRecovery"></div></div>

    <div class="card col-6"><h3><span class="dot"></span><span data-t="t_scatter"></span></h3><p class="hint" data-t="h_scatter"></p><div class="chart" id="chScatter"></div></div>
    <div class="card col-6"><h3><span class="dot"></span><span data-t="t_hr"></span></h3><p class="hint" data-t="h_hr"></p><div class="chart" id="chHr"></div></div>

    <div class="card col-12"><h3><span class="dot"></span><span data-t="t_sleep"></span></h3><p class="hint" data-t="h_sleep"></p><div class="chart" id="chSleep" style="height:260px;"></div></div>

    <div class="card col-12"><h3><span class="dot"></span><span data-t="t_recent"></span></h3><p class="hint" data-t="h_recent"></p><div style="overflow-x:auto;"><table id="tbl"></table></div></div>
  </div>
  </section>

  <section id="viewCoach" class="hidden">
    <div class="coach-grid">
      <div>
        <div class="card">
          <h3><span class="dot"></span><span id="coachPlanTitle"></span></h3>
          <p class="hint" id="coachPhase"></p>
          <div class="week" id="coachWeek"></div>
        </div>
      </div>
      <div class="coach-side">
        <div class="card">
          <h3><span class="dot"></span><span id="coachStateTitle"></span></h3>
          <table class="state-tbl" id="coachState"></table>
        </div>
        <div class="card">
          <h3><span class="dot"></span><span id="coachFocusTitle"></span></h3>
          <ul class="notes2" id="coachFocus"></ul>
        </div>
        <div class="card">
          <h3><span class="dot"></span><span id="coachCommentsTitle"></span></h3>
          <p class="hint" id="coachCommentsHint"></p>
          <textarea class="cbox" id="cbox"></textarea>
          <button class="cbtn" id="cbtn"></button>
          <p class="cnote" id="cnote"></p>
          <div class="clist" id="clist"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewAthlete" class="hidden">
    <div class="coach-grid">
      <div>
        <div class="card">
          <h3><span class="dot"></span><span id="athProfileTitle"></span></h3>
          <p class="hint" id="athProfileHint"></p>
          <div class="pfform">
            <label class="pf"><span id="lbName"></span><input class="cin" id="pfName" type="text"></label>
            <div class="comprow">
              <label class="pf"><span id="lbBirth"></span><input class="cin" id="pfBirth" type="date"></label>
              <label class="pf"><span id="lbSex"></span><select class="cin" id="pfSex"></select></label>
            </div>
            <label class="pf"><span id="lbSports"></span><input class="cin" id="pfSports" type="text"></label>
            <div class="comprow">
              <label class="pf"><span id="lbHr"></span><input class="cin" id="pfHr" type="number" min="0" step="1"></label>
              <label class="pf"><span id="lbAvail"></span><input class="cin" id="pfAvail" type="text"></label>
            </div>
            <label class="pf"><span id="lbGoal"></span><input class="cin" id="pfGoal2" type="text"></label>
            <label class="pf"><span id="lbInj"></span><textarea class="cin pfarea" id="pfInj"></textarea></label>
            <label class="pf"><span id="lbPref"></span><textarea class="cin pfarea" id="pfPref"></textarea></label>
          </div>
          <button class="cbtn" id="athProfileSave"></button>
          <span class="athmsg" id="athProfileMsg"></span>
        </div>
        <div class="card" style="margin-top:14px;">
          <h3><span class="dot"></span><span id="athKnowTitle"></span></h3>
          <p class="hint" id="athKnowHint"></p>
          <textarea class="cbox athbox" id="athKnow" spellcheck="false"></textarea>
          <button class="cbtn" id="athKnowSave"></button>
          <span class="athmsg" id="athKnowMsg"></span>
        </div>
      </div>
      <div class="coach-side">
        <div class="card">
          <h3><span class="dot"></span><span id="athSeasonTitle"></span></h3>
          <div id="athSeason"></div>
        </div>
        <div class="card">
          <h3><span class="dot"></span><span id="athCompTitle"></span></h3>
          <div id="athCompList"></div>
          <div class="compform">
            <input class="cin" id="cfName" type="text">
            <div class="comprow">
              <input class="cin" id="cfDate" type="date">
              <select class="cin" id="cfPrio"></select>
            </div>
            <div class="comprow">
              <input class="cin" id="cfDist" type="number" min="0" step="0.1">
              <input class="cin" id="cfElev" type="number" min="0" step="10">
            </div>
            <input class="cin" id="cfGoal" type="text">
            <button class="cbtn" id="cfAdd"></button>
            <span class="athmsg" id="athCompMsg"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<!-- Static pre-generated data (produced by generar_datos.py). If present, the
     dashboard renders instantly with no folder picker. If absent, it falls back
     to live fetch / folder selection. -->
<script src="data.js" onerror="console.info('data.js not found — will use live fetch / picker')"></script>

<script>
/* ============ Suunto sport code -> Strava-style name ============ */

/* ============ i18n ============ */

/* ============ Data loading ============ */
const NEED = {
  activities: "datos/unificado/activities.json",
  recovery:   "datos/unificado/recovery.json",
  sleep:      "datos/unificado/sleep.json"
};
let RAW = null, lang="en";

function setOv(t,m,showDrop,err){
  document.getElementById('ovTitle').textContent=t;
  document.getElementById('ovMsg').textContent=m;
  document.getElementById('spin').classList.toggle('hidden', !!showDrop);
  document.getElementById('drop').classList.toggle('hidden', !showDrop);
  const e=document.getElementById('ovErr'); e.classList.toggle('hidden', !err); if(err) e.textContent=err;
}

async function tryFetch(){
  const base=[ "../", "" ]; // interfaz/ served, or served at root
  for(const b of base){
    try{
      const res=await Promise.all(Object.values(NEED).map(p=>fetch(b+p)));
      if(res.some(r=>!r.ok)) continue;
      const [activities,recovery,sleep]=await Promise.all(res.map(r=>r.json()));
      return {activities,recovery,sleep};
    }catch(e){ /* try next */ }
  }
  return null;
}

function showPicker(){
  const t=I18N[lang].ov;
  setOv(t.need, t.needMsg, true);
  document.getElementById('dropCta').textContent=t.cta;
  document.getElementById('dropSub').textContent=t.sub;
}

function filesFromList(fileList){
  const map={};
  for(const f of fileList){
    const path=(f.webkitRelativePath||f.name).replace(/\\/g,'/');
    for(const [k,p] of Object.entries(NEED)){
      const tail=p.split('/').pop();
      if(path.endsWith('/'+tail) || path===tail || path.endsWith('unificado/'+tail)) {
        if(path.includes('unificado/'+tail) || !map[k]) map[k]=f;
      }
    }
  }
  return map;
}
function readJson(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{try{res(JSON.parse(r.result));}catch(e){rej(e);} }; r.onerror=rej; r.readAsText(file); }); }

async function handlePicked(fileList){
  const m=filesFromList(fileList);
  if(!m.activities){ setOv(I18N[lang].ov.need, I18N[lang].ov.needMsg, true, I18N[lang].ov.notfound); return; }
  setOv(I18N[lang].ov.loading, I18N[lang].ov.reading, false);
  try{
    const activities=await readJson(m.activities);
    const recovery=m.recovery?await readJson(m.recovery):[];
    const sleep=m.sleep?await readJson(m.sleep):[];
    RAW={activities,recovery,sleep}; boot();
  }catch(e){ setOv(I18N[lang].ov.need, I18N[lang].ov.needMsg, true, String(e)); }
}

function runApp(){
  const CATCOLOR={run:"#ffd400",trail:"#f97316",bike:"#38bdf8",swim:"#22d3ee",walk:"#a3e635",strength:"#a78bfa",other:"#94a3b8"};
  const CATKEYS=["run","trail","bike","swim","walk","strength","other"];
  const L=()=>I18N[lang];

  function mapSport(raw){
    if(typeof raw!=="string") return "Workout";
    const m=raw.match(/^suunto_activity_(\d+)$/);
    if(m) return SUUNTO_MAP[+m[1]]||"Workout";
    return raw;
  }
  function category(s){
    if(s==="Run") return "run";
    if(s==="TrailRun") return "trail";
    if(["Ride","GravelRide","MountainBikeRide","EBikeRide","EMountainBikeRide","VirtualRide","Handcycle","RollerSki"].includes(s)) return "bike";
    if(s==="Swim") return "swim";
    if(["Walk","Hike","Snowshoe","Mountaineering"].includes(s)) return "walk";
    if(["WeightTraining","Crossfit","Gymnastics","Yoga","Pilates","Elliptical","Workout","Meditation"].includes(s)) return "strength";
    return "other";
  }
  const validHr=h=>typeof h==="number"&&h>=40&&h<=230;

  // ---- normalize activities ----
  let HRMAX=190;
  RAW.activities.forEach(a=>{ if(validHr(a.max_hr)) HRMAX=Math.max(HRMAX,a.max_hr); });
  HRMAX=Math.min(210,Math.max(180,HRMAX));

  function computeLoad(sec,hr,cal){
    const min=sec/60;
    if(validHr(hr)){ const i=Math.min(1,Math.max(0,(hr-45)/(HRMAX-45))); return Math.round(min*i*1.6); }
    if(typeof cal==="number"&&cal>0) return Math.round(cal*0.85);
    return Math.round(min*0.55);
  }

  const ACT=RAW.activities.map(a=>{
    const d=new Date(a.start_time_utc||a.startTime||a.start_date||0);
    const sport=mapSport(a.sport);
    const sec=+a.moving_time_s||+a.elapsed_time_s||0;
    const hr=validHr(a.avg_hr)?a.avg_hr:null;
    return {
      date:d, ymd:isNaN(d)?null:d.toISOString().slice(0,10),
      cat:category(sport), sport,
      name:(typeof a.name==="string"&&a.name.trim())?a.name.trim():null,
      km:(+a.distance_m||0)/1000, sec,
      elev:+a.elevation_gain_m||0,
      hr, maxhr:validHr(a.max_hr)?a.max_hr:null,
      cal:+a.calories||0,
      load:computeLoad(sec,validHr(a.avg_hr)?a.avg_hr:null,+a.calories||0),
      source:(a.sources&&a.sources.join?a.sources.join("+"):(a.strava?"strava":"suunto"))
    };
  }).filter(a=>a.ymd).sort((x,y)=>x.date-y.date);

  const ANCHOR = ACT.length? ACT[ACT.length-1].date : new Date();

  // ---- recovery: daily avg balance ----
  const recByDay={};
  (RAW.recovery||[]).forEach(r=>{ if(typeof r.balance!=="number")return; const d=(r.timestamp||"").slice(0,10); if(!d)return; (recByDay[d]=recByDay[d]||[]).push(r.balance); });
  const REC=Object.entries(recByDay).map(([d,arr])=>[d, +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(3)]).sort((a,b)=>a[0]<b[0]?-1:1);

  // ---- sleep: per night hours + quality (exclude naps) ----
  const slByNight={};
  (RAW.sleep||[]).forEach(s=>{ if(s.isNap)return; const dur=+s.duration||0; if(dur<=0)return; const start=new Date(s.bedtimeStart||s.timestamp); if(isNaN(start))return; const night=new Date(start.getTime()-(start.getHours()<12?86400000:0)).toISOString().slice(0,10); const o=(slByNight[night]=slByNight[night]||{dur:0,q:[]}); o.dur+=dur; if(typeof s.quality==="number")o.q.push(s.quality); });
  const SLEEP=Object.entries(slByNight).map(([d,o])=>({d,h:+(o.dur/3600).toFixed(2),q:o.q.length?+(o.q.reduce((a,b)=>a+b,0)/o.q.length).toFixed(2):null})).sort((a,b)=>a.d<b.d?-1:1);

  let state={range:"12m",sport:"all",tab:"dashboard"};
  let charts={};
  let comments=(function(){ try{ return JSON.parse(localStorage.getItem('peakai_demo_v1')||'{}').comments||[]; }catch(e){ return []; } })();

  const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h>0?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`;};
  const fmtPace=p=>{if(!p||!isFinite(p))return"—";const m=Math.floor(p),sec=Math.round((p-m)*60);return `${m}:${String(sec).padStart(2,'0')}`;};
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const mdShort=dstr=>{const d=new Date(dstr);return `${d.getDate()}/${d.getMonth()+1}`;};
  const tooltip=(x={})=>Object.assign({backgroundColor:css('--bg-2'),borderColor:css('--card-brd'),textStyle:{color:css('--text')},confine:true},x);

  function cutoff(){ if(state.range==="all") return new Date(0); const d=new Date(ANCHOR); d.setMonth(d.getMonth()-(state.range==="3m"?3:12)); return d; }
  function filtered(){ const c=cutoff(); return ACT.filter(a=>a.date>=c && (state.sport==="all"||a.cat===state.sport)); }
  function bucketMonthly(){ return state.range==="all" || state.range==="12m" && false; } // weekly for 3m/12m, monthly for all
  function isoWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
  function monthKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;}

  function renderStatic(){
    document.documentElement.lang=lang;
    document.getElementById('tagline').textContent=L().tagline;
    const uname=(RAW&&RAW.meta&&RAW.meta.user)||(window.PEAK_DATA&&PEAK_DATA.meta&&PEAK_DATA.meta.user)||"";

    sf.value=state.sport;
    document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=L()[el.dataset.t];});
    document.getElementById('foot').innerHTML=L().foot;
    document.getElementById('langBtn').textContent=lang==="en"?"ES":"EN";
    // tab + coach static labels
    document.getElementById('tabDash').textContent=L().tabs.dash;
    document.getElementById('tabCoach').textContent=L().tabs.coach;
    document.getElementById('coachPlanTitle').textContent=L().coach.plan;
    document.getElementById('coachStateTitle').textContent=L().coach.state;
    document.getElementById('coachFocusTitle').textContent=L().coach.focus;
    document.getElementById('coachCommentsTitle').textContent=L().coach.comments;
    document.getElementById('coachCommentsHint').textContent=L().coach.commentsHint;
    document.getElementById('cbox').placeholder=L().coach.ph;
    document.getElementById('cbtn').textContent=L().coach.add;
    document.getElementById('cnote').textContent=L().coach.note;
    // athlete static labels
    const A=L().ath;
    document.getElementById('tabAthlete').textContent=L().tabs.athlete;
    document.getElementById('athProfileTitle').textContent=A.profile;
    document.getElementById('athProfileHint').textContent=A.profileHint;
    document.getElementById('athProfileSave').textContent=A.save;
    document.getElementById('athKnowTitle').textContent=A.know;
    document.getElementById('athKnowHint').textContent=A.knowHint;
    document.getElementById('athKnowSave').textContent=A.save;
    document.getElementById('athSeasonTitle').textContent=A.season;
    document.getElementById('athCompTitle').textContent=A.comp;
    document.getElementById('cfName').placeholder=A.fName;
    document.getElementById('cfGoal').placeholder=A.fGoal;
    document.getElementById('cfDist').placeholder=A.fDist;

    document.getElementById('cfPrio').innerHTML=Object.entries(A.prio).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
    // profile field labels

  const LS_KEY='peakai_demo_v1';
  const DEMO_DEFAULTS={

  function lsLoad(){ try{ return Object.assign({}, DEMO_DEFAULTS, JSON.parse(localStorage.getItem(LS_KEY)||'{}')); }catch(e){ return Object.assign({},DEMO_DEFAULTS); } }
  function lsSave(patch){ const cur=lsLoad(); Object.assign(cur,patch); localStorage.setItem(LS_KEY, JSON.stringify(cur)); return cur; }
  async function api(path, opts){
    // Tiny in-browser mock of the real /api backend, keyed on path+method.
    await new Promise(r=>setTimeout(r,120)); // feels like a save
    const method=(opts&&opts.method)||'GET';
    const body=opts&&opts.body?JSON.parse(opts.body):null;
    if(path==='/athlete' && method==='GET'){ const s=lsLoad(); return {profile:s.profile, knowledge:s.knowledge, competitions:s.competitions}; }
    if(path==='/profile' && method==='PUT'){ const s=lsSave({profile:body.profile}); return {profile:s.profile}; }
    if(path==='/knowledge' && method==='PUT'){ const s=lsSave({content:body.content, knowledge:body.content}); return {knowledge:s.knowledge}; }
    if(path==='/competitions' && method==='PUT'){ const s=lsSave({competitions:body.competitions}); return {competitions:s.competitions}; }
    if(path==='/comment' && method==='POST'){ const s=lsLoad(); const c={text:body.text, ts:new Date().toLocaleString(lang==='es'?'es-ES':'en-GB')}; s.comments=[c,...(s.comments||[])]; lsSave({comments:s.comments}); return {ok:true}; }
    throw new Error('Unknown demo endpoint: '+path);
  }

  function renderSeason(){
    const el=document.getElementById('athSeason'); if(!el) return;
    const A=L().ath;
    const today=new Date(); today.setHours(0,0,0,0);
    const upcoming=ATH.competitions.filter(c=>c.date && new Date(c.date)>=today)
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    if(!upcoming.length){ el.innerHTML=`<div class="hint">${A.noComp}</div>`; return; }
    const next=upcoming[0];
    const days=Math.ceil((new Date(next.date)-today)/86400000);
    // fase simple según cuenta atrás al próximo objetivo
    let phase;
    if(days<=7) phase=lang==='es'?'Puesta a punto (taper)':'Taper';
    else if(days<=28) phase=lang==='es'?'Específico / afinado':'Peak / specific';
    else if(days<=84) phase=lang==='es'?'Construcción':'Build';
    else phase=lang==='es'?'Base':'Base';
    el.innerHTML=`
      <div class="countdown">${days} <small>${A.daysTo}</small></div>
      <div class="season-next"><b>${esc(next.name)}</b> · ${esc(next.date)}${next.priority?` · ${next.priority}`:''}</div>
      <div class="season-phase">${A.phase}: ${phase}</div>`;

      series:[
        {name:L().legend.hours,type:'bar',data:rows.map(s=>s.h),itemStyle:{color:'#8b5cf6',borderRadius:[3,3,0,0]},barMaxWidth:14},
        {name:L().legend.quality,type:'line',yAxisIndex:1,data:rows.map(s=>s.q),smooth:true,symbol:'none',connectNulls:true,lineStyle:{width:2.5,color:css('--accent')}}
      ]
    },true);
  }

  function renderTable(){
    const rows=filtered().slice().sort((a,b)=>b.date-a.date).slice(0,15);
    const T=L().th;
    document.getElementById('tbl').innerHTML=`
      <thead><tr><th>${T.date}</th><th>${T.activity}</th><th>${T.sport}</th><th class="num">${T.dist}</th><th class="num">${T.time}</th><th class="num">${T.pace}</th><th class="num">${T.elev}</th><th class="num">${T.hr}</th><th class="num">${T.load}</th><th>${T.source}</th></tr></thead>
      <tbody>${rows.map(a=>{const pace=(a.cat==="run"||a.cat==="trail")&&a.km>0?a.sec/60/a.km:null;return `<tr>
        <td class="num">${a.ymd}</td>
        <td>${a.name||a.sport}</td>
        <td><span class="pill" style="background:${CATCOLOR[a.cat]}22;color:${CATCOLOR[a.cat]}">${L().cat[a.cat]}</span></td>
        <td class="num">${a.km>0?a.km.toFixed(1)+' km':'—'}</td>
        <td class="num">${fmtTime(a.sec)}</td>
        <td class="num">${pace?fmtPace(pace):'—'}</td>
        <td class="num">${Math.round(a.elev)} m</td>
        <td class="num">${a.hr||'—'}</td>
        <td class="num">${a.load}</td>
        <td class="src">${a.source}</td>
      </tr>`;}).join('')}</tbody>`;
  }

  function initCharts(){
    ["Volume|vol","Sport|sport","Pace|pace","Intensity|intensity","Calendar|cal","Recovery|recovery","Scatter|scatter","Hr|hr","Sleep|sleep"].forEach(x=>{
      const [id,key]=x.split("|"); charts[key]=echarts.init(document.getElementById("ch"+id));
    });
  }
  function safe(fn){ try{ fn(); }catch(e){ console.error(fn.name,e); } }
  function renderAll(){
    renderStatic();
    [renderKPIs,chVolume,chSport,chPace,chIntensity,chCalendar,chRecovery,chScatter,chHr,chSleep,renderTable].forEach(safe);
  }

  document.getElementById('rangeSeg').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;
    [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active'); state.range=e.target.dataset.r; renderAll();
  });
  document.getElementById('sportFilter').addEventListener('change',e=>{state.sport=e.target.value;renderAll();});
  document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==="en"?"es":"en";renderStatic();renderCoach();if(state.tab==='dashboard')renderAll();});
  const themeBtn=document.getElementById('themeBtn');
  themeBtn.addEventListener('click',()=>{const light=document.documentElement.classList.toggle('light');themeBtn.textContent=light?'☾':'☀︎';setTimeout(()=>{if(state.tab==='dashboard')renderAll();renderCoach();},60);});
  window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c&&c.resize()));

  document.getElementById('tabDash').addEventListener('click',()=>showTab('dashboard'));
  document.getElementById('tabCoach').addEventListener('click',()=>showTab('coach'));
  document.getElementById('tabAthlete').addEventListener('click',()=>showTab('athlete'));
  document.getElementById('cbtn').addEventListener('click',async ()=>{
    const box=document.getElementById('cbox'); const t=box.value.trim(); if(!t)return;
    const btn=document.getElementById('cbtn'); btn.disabled=true;
    document.getElementById('cnote').textContent=L().coach.saving;
    // optimista en pantalla
    comments.unshift({text:t, ts:new Date().toLocaleString(lang==="es"?"es-ES":"en-GB")});
    box.value=""; renderCoach();
    try{
      await api('/comment',{method:'POST',body:JSON.stringify({text:t})});
      document.getElementById('cnote').textContent=L().coach.saved;
    }catch(e){
      document.getElementById('cnote').textContent=L().coach.error+': '+e.message;
    }finally{ btn.disabled=false; }
  });
  document.getElementById('athProfileSave').addEventListener('click',saveProfile);
  document.getElementById('athKnowSave').addEventListener('click',saveKnowledge);
  document.getElementById('cfAdd').addEventListener('click',addCompetition);

  initCharts(); renderAll(); renderCoach();
}

/* ============ bootstrap ============ */
(async function(){
  // 1) Static path: data baked in by generar_datos.py → render immediately.
  if(window.PEAK_DATA && Array.isArray(window.PEAK_DATA.activities) && window.PEAK_DATA.activities.length){
    RAW=window.PEAK_DATA; boot(); return;
  }
  // 2) Otherwise, try live fetch, then folder picker.
  setOv(I18N[lang].ov.loading, I18N[lang].ov.reading, false);
  // wire picker
  const drop=document.getElementById('drop'), picker=document.getElementById('picker');
  drop.addEventListener('click',()=>picker.click());
  picker.addEventListener('change',e=>handlePicked(e.target.files));
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();}));
  drop.addEventListener('drop',e=>{e.preventDefault(); const fs=[]; if(e.dataTransfer.items){for(const it of e.dataTransfer.items){const f=it.getAsFile&&it.getAsFile(); if(f)fs.push(f);}} else {for(const f of e.dataTransfer.files)fs.push(f);} handlePicked(fs);});

  const data=await tryFetch();
  if(data){ RAW=data; boot(); }
  else { showPicker(); }
})();
</script>
</body>
</html>
